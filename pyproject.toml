[project]
name = "optibox-harbor"
version = "0.1.0"
description = "Harbor environment adapter for Ascii Box."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "harbor>=0.14.0",
  "httpx>=0.27.0",
  "tenacity>=9.1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.4.0", "pytest-asyncio>=1.2.0"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harbor_box"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "real_box: requires BOX_API_KEY and talks to the real Box API",
]
